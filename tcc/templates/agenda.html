<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BLK - Agenda</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/agenda.css') }}"
    >

</head>

<body>

    <div id="app">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="topbar">

            <div class="logo">
                BLK
            </div>

            <nav>

                <a
                    href="#"
                    class="active"
                >
                    Agenda
                </a>

                <a href="{{ url_for('clientes') }}">
                    Clientes
                </a>

                <a href="{{ url_for('atendimentos') }}">
                    Atendimentos
                </a>

                <a href="{{ url_for('servicos') }}">
                    Serviços
                </a>

            </nav>

        </header>


        <!-- =====================================================
             CABEÇALHO DA AGENDA
        ====================================================== -->

        <section class="agenda-header">

            <div class="left-info">

                <h1 style="font-family: luciole;">
                    Agenda
                </h1>

                <div class="legend">

                    <strong>
                        Legenda:
                    </strong>

                    <div class="legend-item">

                        <span class="event-circle"></span>

                        Atendimento

                    </div>

                </div>

            </div>


            <button
                id="openReminderModal"
                class="create-btn"
                type="button"
            >

                Criar Lembrete

                <span>
                    +
                </span>

            </button>

        </section>


        <!-- =====================================================
             CONTEÚDO PRINCIPAL
        ====================================================== -->

        <main class="content">


            <!-- =================================================
                 PAINEL DE LEMBRETES
            ================================================== -->

            <aside class="reminders-panel">

                <h2>
                    Lembretes
                </h2>

                <div
                    id="remindersList"
                    class="reminders-list"
                >
                </div>

            </aside>


            <!-- =================================================
                 CALENDÁRIO
            ================================================== -->

            <section class="calendar-panel">

                <div class="calendar-header">

                    <button
                        id="prevMonth"
                        class="nav-btn"
                        type="button"
                    >
                        &#10094;
                    </button>


                    <h2 id="monthYear"></h2>


                    <button
                        id="nextMonth"
                        class="nav-btn"
                        type="button"
                    >
                        &#10095;
                    </button>

                </div>


                <table class="calendar">

                    <thead>

                        <tr>

                            <th>
                                Dom
                            </th>

                            <th>
                                Seg
                            </th>

                            <th>
                                Ter
                            </th>

                            <th>
                                Qua
                            </th>

                            <th>
                                Qui
                            </th>

                            <th>
                                Sex
                            </th>

                            <th>
                                Sáb
                            </th>

                        </tr>

                    </thead>


                    <tbody id="calendarBody">
                    </tbody>

                </table>

            </section>

        </main>

    </div>


    <!-- =========================================================
         MODAL DE CRIAÇÃO / EDIÇÃO DE LEMBRETE
    ========================================================== -->

    <div
        id="modalOverlay"
        class="modal-overlay"
    >

        <div class="modal">

            <h2>
                CRIAR LEMBRETE
            </h2>


            <form
                id="reminderForm"
                method="post"
                action="{{ url_for('pegar_dados') }}"
            >


                <!-- =============================================
                     DATA
                ============================================== -->

                <div class="input-group">

                    <input
                        type="date"
                        id="date"
                        name="data"
                        required
                    >

                </div>


                <!-- =============================================
                     ATENDIMENTO
                ============================================== -->

                <div class="input-group">

                    <!--
                        O campo "Atendimento" possui duas funções:

                        1. Identificar o atendimento relacionado
                           ao lembrete;

                        2. Servir como título exibido no lembrete.

                        A busca de atendimentos será integrada
                        posteriormente.
                    -->

                    <input
                        type="text"
                        id="appointment"
                        name="atendimento"
                        placeholder="Atendimento"
                    >


                    <button
                        type="button"
                        class="icon-btn"
                        title="Buscar atendimento"
                    >

                        <i class="fa-solid fa-magnifying-glass"></i>

                    </button>

                </div>


                <!-- =============================================
                     DESCRIÇÃO
                ============================================== -->

                <div class="input-group">

                    <textarea
                        id="description"
                        name="descricao"
                        placeholder="Descrição"
                    ></textarea>

                </div>


                <!-- =============================================
                     AÇÕES DO MODAL
                ============================================== -->

                <div class="modal-actions">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Criar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================================================
         TOOLTIP DOS DIAS
    ========================================================== -->

    <div
        id="dayTooltip"
        class="day-tooltip hidden"
    ></div>


    <!-- =========================================================
         DADOS INICIAIS DOS LEMBRETES
    ==========================================================

         O Flask fornece os lembretes existentes no banco através
         da variável "dados".

         O JavaScript transforma esses dados em objetos e passa
         a controlar a agenda no navegador.

         Exemplo gerado:

         {
             id: 1,
             data: "2026-07-29",
             titulo: "Atendimento João",
             descricao: "Limpeza..."
         }

    ========================================================== -->

    <script>
        const lembretes = {{ dados | tojson }};
    </script>


    <!-- =========================================================
         JAVASCRIPT DA AGENDA
    ========================================================== -->

    <script
        src="{{ url_for('static', filename='js/agenda.js') }}"
    ></script>

</body>

</html>
