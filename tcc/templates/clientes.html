<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BLK - Clientes</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/clientes.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

<div id="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="topbar">

        <div class="logo">
            BLK
        </div>

        <nav>

            <a href="{{ url_for('agenda') }}">
                Agenda
            </a>

            <a
                class="active"
                href="#"
            >
                Clientes
            </a>

            <a href="{{ url_for('atendimentos') }}">
                Atendimentos
            </a>

            <a href="{{ url_for('servicos') }}">
                Serviços
            </a>

        </nav>

    </header>


    <!-- =====================================================
         SUB HEADER
    ====================================================== -->

    <section class="page-header">

        <h1>
            Clientes
        </h1>

        <button
            id="btnNovoCliente"
            class="new-btn"
            type="button"
        >

            Novo Cliente

            <span>
                +
            </span>

        </button>

    </section>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="page-content">

        <!-- PESQUISA -->

        <div class="search-container">

            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Pesquisar Clientes"
                    autocomplete="off"
                >

                <button
                    type="button"
                    aria-label="Pesquisar"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>

            <select
                id="filterType"
                aria-label="Filtrar clientes por campo"
            >
                <option value="todos">Todos os campos</option>
                <option value="nome">Nome</option>
                <option value="telefone">Telefone</option>
                <option value="dataCadastro">Data de cadastro</option>
                <option value="endereco">Endereço</option>
                <option value="id">ID</option>
            </select>

        </div>


        <!-- TABELA -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Nome
                        </th>

                        <th>
                            Telefone
                        </th>

                        <th>
                            Data de cadastro
                        </th>

                        <th>
                            Endereço
                        </th>

                        <th>
                            ID
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="clientesTableBody">

                    <!--
                        Os clientes são carregados
                        pelo JavaScript através de:

                        GET /api/clientes
                    -->

                </tbody>

            </table>

        </div>

    </main>

</div>


<!-- =========================================================
     MODAL — CADASTRAR CLIENTE
========================================================= -->

<div
    id="createModal"
    class="modal-overlay"
>

    <div class="modal">

        <button
            class="close-btn"
            type="button"
            onclick="closeCreateModal()"
            aria-label="Fechar"
        >
            &times;
        </button>


        <h2>
            CADASTRAR CLIENTE
        </h2>


        <form id="createForm">

            <input
                type="text"
                id="createNome"
                placeholder="Nome*"
                autocomplete="name"
                required
            >


            <input
                type="text"
                id="createTelefone"
                placeholder="Telefone*"
                autocomplete="tel"
                required
            >


            <input
                type="text"
                id="createEndereco"
                placeholder="Endereço*"
                autocomplete="street-address"
                required
            >


            <button
                type="submit"
                class="submit-btn"
            >
                Cadastrar
            </button>

        </form>

    </div>

</div>


<!-- =========================================================
     MODAL — EDITAR CLIENTE
========================================================= -->

<div
    id="editModal"
    class="modal-overlay"
>

    <div class="modal">

        <button
            class="close-btn"
            type="button"
            onclick="closeEditModal()"
            aria-label="Fechar"
        >
            &times;
        </button>


        <h2>
            EDITAR CLIENTE
        </h2>


        <form id="editForm">

            <input
                type="hidden"
                id="editId"
            >


            <input
                type="text"
                id="editNome"
                placeholder="Nome*"
                autocomplete="name"
                required
            >


            <input
                type="text"
                id="editTelefone"
                placeholder="Telefone*"
                autocomplete="tel"
                required
            >


            <input
                type="text"
                id="editEndereco"
                placeholder="Endereço*"
                autocomplete="street-address"
                required
            >


            <button
                type="submit"
                class="submit-btn"
            >
                Salvar
            </button>

        </form>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

    <div id="deleteConfirmModal" class="modal-overlay" aria-hidden="true">
        <div class="modal delete-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
            <button type="button" class="close-btn" id="closeDeleteConfirm" aria-label="Fechar">&times;</button>
            <h2 id="deleteConfirmTitle">EXCLUIR CLIENTE?</h2>
            <p>Deseja realmente excluir <strong id="deleteConfirmName"></strong>?</p>
            <div class="delete-confirm-actions">
                <button type="button" class="cancel-delete-btn" id="cancelDeleteConfirm">Cancelar</button>
                <button type="button" class="submit-btn" id="confirmDeleteAction">Excluir</button>
            </div>
        </div>
    </div>

<script
    src="{{ url_for('static', filename='js/clientes.js') }}"
></script>
</body>

</html>
